<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בדיקת רכב">
<meta name="theme-color" content="#0f172a">
<title>בדיקת רכב לפני רכישה</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mute:#94a3b8;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--plate:#f7d117;--in:#0b1222;--blue:#60a5fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);padding:16px 16px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin-inline:auto;line-height:1.45}
  h1{font-size:20px;margin:6px 0 16px;text-align:center}
  h3{font-size:14px;margin:14px 0 8px;color:var(--txt)}
  .plate{display:flex;align-items:stretch;border:3px solid #111;border-radius:10px;overflow:hidden;background:var(--plate);direction:ltr}
  .plate .il{background:#1e40af;color:#fff;font-weight:700;font-size:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 8px}
  .plate input{flex:1;border:0;background:transparent;font-size:30px;font-weight:800;text-align:center;letter-spacing:2px;padding:10px 4px;color:#111;min-width:0;outline:none}
  button{font:inherit;cursor:pointer}
  .go{width:100%;margin-top:10px;background:var(--acc);color:#04210f;border:0;border-radius:10px;padding:14px;font-size:18px;font-weight:700}
  .go:disabled{opacity:.6}
  .cam{display:block;text-align:center;margin-top:8px;background:transparent;color:var(--txt);border:2px dashed var(--line);border-radius:10px;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
  #ocrPrev{max-width:100%;border-radius:8px;margin-top:8px;display:block;margin-inline:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
  .card h2{font-size:15px;color:var(--mute);margin:0 0 10px;font-weight:600}
  .big{font-size:22px;font-weight:800;margin:6px 0 4px}
  .sub{color:var(--mute);font-size:14px}
  .small{font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kv{background:var(--in);border-radius:8px;padding:8px 10px;display:block}
  .kv .k{font-size:12px;color:var(--mute)}
  .kv .v{font-size:16px;font-weight:700;margin-top:2px;word-break:break-word}
  .kv .v.na{font-size:13px;font-weight:600;color:var(--warn)}
  .src{font-size:10.5px;color:var(--mute);margin-top:4px;opacity:.85}
  .src.na{color:var(--warn)} .src.est{color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
  th{color:var(--mute);font-weight:600}
  td.num{direction:ltr;text-align:left}
  .price{font-size:28px;font-weight:900;color:var(--plate)}
  .note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
  .err{color:var(--bad);font-weight:600}
  .warn{color:var(--warn)}
  .mute{color:var(--mute)}
  .hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .hist button{background:var(--in);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--mute);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
  @keyframes s{to{transform:rotate(360deg)}}
  details summary{cursor:pointer;color:var(--mute);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .chip.ok{background:#14532d;color:#bbf7d0} .chip.bad{background:#78350f;color:#fde68a}
  .inp{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--txt);font-size:16px;font-weight:700;padding:4px 0;outline:none}
  .neg{color:#fca5a5} .pos{color:#86efac}
  .lnk{display:block;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;color:var(--txt);text-decoration:none;font-weight:600}
  .lnk.sm{padding:8px 10px;font-size:13px;display:inline-block}
  pre{white-space:pre-wrap;font-size:11px;color:var(--mute);direction:ltr;text-align:left}

  /* חדש */
  .row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .gap{gap:8px} .mt{margin-top:10px}
  .pl{direction:ltr;background:var(--plate);color:#111;font-weight:900;border-radius:6px;padding:2px 10px;letter-spacing:1px;font-size:18px}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.ok{background:#14532d;color:#bbf7d0} .badge.bad{background:#7f1d1d;color:#fecaca}
  .badge.na{background:#78350f;color:#fde68a} .badge.est{background:#1e3a8a;color:#bfdbfe}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .btn{background:var(--in);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-weight:700}
  .btn.pri{background:var(--acc);color:#04210f;border-color:var(--acc)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.6}
  .banner{border-color:var(--blue);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
  .risk{display:flex;gap:16px;align-items:center}
  .risk .score{font-size:46px;font-weight:900;line-height:1}
  .risk .score small{font-size:14px;color:var(--mute);font-weight:600}
  .risk.low .score{color:var(--acc)} .risk.mid .score{color:var(--warn)} .risk.high .score{color:var(--bad)}
  .risk>div:last-child{flex:1}
  .bar{height:6px;background:var(--in);border-radius:4px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue)}
  .warnbox{background:#3b2a0b;border:1px solid #78350f;color:#fde68a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
  .comps{margin-top:10px;display:grid;gap:8px}
  .comp{background:var(--in);border-radius:8px;padding:8px 10px}
  .comp.off{border:1px dashed #78350f}
  .comp .sub{font-size:13px;margin-top:2px}
  .nc{background:var(--in);border:1px dashed #78350f;border-radius:8px;padding:10px;margin-top:8px}
  .nc-h{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
  .nc .sub{font-size:13px}
  .cmpi{background:var(--in);border-radius:8px;padding:8px 10px;margin-top:8px}
  .recs{margin:0;padding-inline-start:18px;display:grid;gap:6px;font-size:14px}
  .recs li.must::marker{content:"⛔ "} .recs li.high::marker{content:"⚠️ "} .recs li.mid::marker{content:"🔸 "} .recs li.info::marker{content:"ℹ️ "}
  .recs li.must{font-weight:700}
  .srcs td,.srcs th{font-size:12.5px} .srcs a{color:var(--blue)}
  .tscroll{overflow-x:auto;margin-inline:-4px}
  .cmpT th:first-child{white-space:nowrap}
  .cmpT td,.cmpT th{font-size:13px;min-width:90px}
  .linkbtn{background:none;border:0;color:var(--blue);padding:0;font-weight:700;text-align:right}
  .li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .li .linkbtn{flex:1}
  .x{background:none;border:0;color:var(--mute);font-size:16px;padding:4px 8px}
  .field{width:100%;background:var(--in);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px;font-size:16px;margin-top:8px}
  .ltr{direction:ltr;text-align:left}
  .plan{background:var(--in);border-radius:8px;padding:10px;margin-top:8px}
  .cmpSlots{display:grid;gap:8px}
  .cmpSlots .plate input{font-size:22px;padding:6px 4px}
  .tabs{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;background:rgba(15,23,42,.96);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(8px)}
  .tabs button{flex:1;max-width:200px;background:none;border:0;color:var(--mute);font-size:12px;font-weight:700;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tabs button span{font-size:20px}
  .tabs button[aria-current="page"]{color:var(--acc)}
  .print-only{display:none}
  @media (max-width:360px){ .grid{grid-template-columns:1fr} }

  /* הדפסה / PDF – רקע בהיר, בלי ממשק */
  @media print{
    :root{--bg:#fff;--card:#fff;--line:#d1d5db;--txt:#111827;--mute:#4b5563;--in:#f3f4f6;--plate:#f7d117}
    body{padding:0;max-width:none;font-size:12px}
    .tabs,form,#hist,.noprint,h1,[data-view]:not([data-view="check"]){display:none!important}
    .print-only{display:block}
    .ph{font-size:18px;font-weight:900;margin-bottom:8px}
    .card{border-color:#d1d5db;margin-top:10px}
    .kv,.comp,.nc,.cmpi,tr,li,h2,h3{break-inside:avoid} h2,h3{break-after:avoid}
    .price{color:#111}
    .inp{border:0}
    .warnbox{background:#fef3c7;color:#78350f}
    .badge.ok,.chip.ok{background:#dcfce7;color:#14532d} .badge.bad{background:#fee2e2;color:#7f1d1d}
    .badge.na,.chip.bad{background:#fef3c7;color:#78350f} .badge.est{background:#dbeafe;color:#1e3a8a}
    .neg{color:#b91c1c} .pos{color:#15803d} .src.na{color:#92400e} .src.est{color:#1d4ed8}
    a{color:#111;text-decoration:none}
    @page{margin:12mm}
  }
</style>
</head>
<body>

<section data-view="check">
  <h1>🚗 בדיקת רכב לפני רכישה</h1>
  <form id="f" autocomplete="off">
    <div class="plate">
      <div class="il">IL<br>🇮🇱</div>
      <input id="plate" inputmode="numeric" placeholder="00-000-00" maxlength="12" aria-label="מספר רישוי">
    </div>
    <button class="go" id="go">בדוק</button>
    <label class="cam" for="photo">📷 צלם / בחר תמונה של לוחית</label>
    <input type="file" id="photo" accept="image/*" hidden>
    <div id="ocr" class="sub" style="text-align:center;margin-top:6px"></div>
  </form>
  <div class="hist" id="hist"></div>
  <div id="out"></div>
</section>

<section data-view="compare" hidden>
  <h1>⚖️ השוואת רכבים</h1>
  <form id="cmpForm" class="card" autocomplete="off">
    <h2>עד שלושה רכבים</h2>
    <div class="cmpSlots">
      <div class="plate"><div class="il">IL</div><input class="cmpIn" dir="auto" inputmode="numeric" placeholder="רכב 1 · 00-000-00" maxlength="12"></div>
      <div class="plate"><div class="il">IL</div><input class="cmpIn" dir="auto" inputmode="numeric" placeholder="רכב 2 · 00-000-00" maxlength="12"></div>
      <div class="plate"><div class="il">IL</div><input class="cmpIn" dir="auto" inputmode="numeric" placeholder="רכב 3 · רשות" maxlength="12"></div>
    </div>
    <button class="go">השווה</button>
    <button type="button" class="btn sm mt" id="cmpClear">ניקוי</button>
  </form>
  <div id="cmpOut"></div>
</section>

<section data-view="me" hidden>
  <h1>👤 האזור שלי</h1>
  <div id="meOut"></div>
</section>

<nav class="tabs" aria-label="ניווט">
  <button data-tab="check" aria-current="page"><span>🔍</span>בדיקה</button>
  <button data-tab="compare"><span>⚖️</span>השוואה</button>
  <button data-tab="me"><span>👤</span>האזור שלי</button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
